name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - '*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  # Each feature build otherwise leaves large debug/incremental artifacts behind
  # and can exhaust the hosted Linux runner's disk before the matrix finishes.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: none
    name: CI
    needs: [test, msrv, lockfile, rustfmt, clippy, docs, vscode, release-checks, linux-arm-release]
    runs-on: ubuntu-latest
    if: "always()"
    steps:
      - name: Failed
        run: exit 1
        if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')"
  test:
    name: Test
    env:
      # ort rc.11 can race while dropping/recreating its global environment.
      # Serialize model-backed tests until that upstream lifetime issue is fixed.
      RUST_TEST_THREADS: 1
    strategy:
      fail-fast: false
      matrix:
        # Windows tests disabled due to esaxx-rs/ort runtime library mismatch (MT vs MD)
        # See: https://github.com/huggingface/tokenizers/issues/1482
        os: ["ubuntu-latest", "macos-latest"]
        rust: ["stable"]
    continue-on-error: ${{ matrix.rust != 'stable' }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-hack
    - name: Build and Test
      run: cargo hack test --each-feature --workspace --locked
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: docs-site/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: docs-site/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - run: pnpm audit
    - run: pnpm build
  vscode:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ck-vscode
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ck-vscode/package-lock.json
    - run: npm ci --ignore-scripts
    # Packaging also compiles and checks API types against engines.vscode.
    - run: npm run package -- --out "$RUNNER_TEMP/ck-search.vsix"
    - run: python3 ../.github/tests/test_vscode_package.py "$RUNNER_TEMP/ck-search.vsix"
    - run: npm audit
  release-checks:
    name: Release workflow regression tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: node --test .github/tests/test_install_targets.cjs
    - run: python3 .github/tests/test_release_finalization.py -v
  linux-arm-release:
    name: Linux ARM64 release smoke test
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-gnu
    - uses: Swatinem/rust-cache@v2
    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev perl make
    - name: Build the release binary
      run: bash .github/scripts/build-linux-release.sh aarch64-unknown-linux-gnu
    - name: Exercise the release binary
      run: |
        binary="$PWD/target/aarch64-unknown-linux-gnu/release/ck"
        ldd "$binary"
        readelf --version-info "$binary" | grep -E "Name: (GLIBC|GLIBCXX|CXXABI)"
        bash .github/tests/test_release_binary.sh "$binary"
  msrv:
    name: "Check MSRV"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-hack
    - name: Default features
      run: cargo hack check --each-feature --locked --rust-version --ignore-private --workspace --all-targets --keep-going
  minimal-versions:
    name: Minimal versions
    # Temporarily disabled due to issue building sharded-slab in CI
    if: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Install nightly Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
    - name: Downgrade dependencies to minimal versions
      run: cargo +nightly generate-lockfile -Z minimal-versions
    - name: Compile with minimal versions
      run: cargo +stable check --workspace --all-features --locked --keep-going
  lockfile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@v2
    - name: "Is lockfile updated?"
      run: cargo update --workspace --locked
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.89"  # STABLE
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload sarif results
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.89"  # STABLE
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Install SARIF tools
      run: cargo install clippy-sarif --locked
    - name: Install SARIF tools
      run: cargo install sarif-fmt --locked
    - name: Check
      run: >
        cargo clippy --workspace --all-features --all-targets --message-format=json
        | clippy-sarif
        | tee clippy-results.sarif
        | sarif-fmt
      continue-on-error: true
    - name: Upload
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: clippy-results.sarif
        wait-for-processing: true
    - name: Report status
      run: cargo clippy --workspace --all-features --all-targets --keep-going -- -D warnings
